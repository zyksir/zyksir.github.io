<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  {%- capture page_title -%}
    {% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}
  {%- endcapture -%}
  <title>{{ page_title | strip_html | strip }}</title>

  <meta name="author" content="Yikai Zhu">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip | truncate: 160 }}">
  <meta name="keywords" content="{{ site.keyword }}">
  <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page_title | strip_html | strip }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip | truncate: 160 }}">
  <meta property="og:type" content="{% if page.layout == 'post' or page.layout == 'distill' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="icon" href="https://github.com/zyksir.png">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Set theme + language before paint to avoid a flash -->
  <script>
    (function () {
      var theme = localStorage.getItem('theme');
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-lang', localStorage.getItem('lang') || 'zh');
    })();
  </script>

  {%- if site.ga_track_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_track_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.ga_track_id }}');
  </script>
  {%- endif %}

  <!-- Google AdSense -->
  <script data-ad-client="ca-pub-6487568398225121" async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
</head>
