# Site settings
title: Yikai Zhu's Blog
SEOTitle: Yikai Zhu's Blog
header-img: img/background/walle-bg.jpg
email: zhuyikai.zyk@gmail.com
description: "Yikai Zhu's blog on machine learning systems, GPU kernels, and generative AI."
keyword: "Yikai Zhu, Machine Learning Systems, GPU, Triton, CUDA, Generative AI, Diffusion"
url: "https://zyksir.github.io" # [github-username].github.io
baseurl: "" # please leave it empty here

# Width of the centered content column (al-folio distill style).
max_width: 820px

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
# weibo_username: 
# zhihu_username: 
github_username: zyksir
# twitter_username: 
# facebook_username:  
linkedin_username:  zyksir

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: []

# The distill layout shows a left-margin table of contents, built client-side
# from the visible headings. Set `toc: false` in a post's front matter to hide it.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Comment settings
utterances_enable: false
disqus_enable: false

# Netease settings
netease_comment: false

# Analytics settings
# Baidu Analytics
# ba_track_id: 196ae0d2a7f94f1a7e16a435f02cff16

# Google Analytics
ga_track_id: "G-ZSJ13EK1TT" # Format: UA-xxxxxx-xx
ga_domain: zyksir.github.io

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "要拥有一个有趣的灵魂 <br> Alibaba Infrastructure Service @ Alibaba Cloud"
sidebar-avatar: https://github.com/zyksir.png # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 1 # A tag will be featured if the size of it is more than this condition value

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: true

